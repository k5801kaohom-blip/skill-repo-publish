name: verify

# Proves every push and pull request leaves the repository in a state a fresh clone can
# install and use. The failure this exists to catch: SKILL.md documenting a file that was
# never committed, so the skill looks complete but is unusable for anyone who clones it.
# The author's machine still has the file, so only a clean clone detects it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly, to catch drift no push caused — a file deleted on the remote, or a
    # dependency of the checks disappearing.
    - cron: "0 1 * * 1"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and a real remote, so the commit-sync stage is meaningful.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show environment
        run: |
          echo "commit : $GITHUB_SHA"
          echo "ref    : $GITHUB_REF"
          python3 --version
          git --version

      # On a pull_request event the checked-out HEAD is a merge commit, not origin/main,
      # so the sync stages would report a false failure on every PR. They run on push;
      # pull requests run the integrity stages offline.
      - name: Repository integrity
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ./verify_skill_repo.sh --json verify-report.json
          else
            ./verify_skill_repo.sh --offline --json verify-report.json
          fi

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: verify-report.json
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "## Repository verification" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if [ -f verify-report.json ] && [ -f scripts/ci_summary.py ]; then
            python3 scripts/ci_summary.py verify-report.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_verify-report.json was not produced_" >> "$GITHUB_STEP_SUMMARY"
          fi

  payload:
    name: skill payload check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Runs what a consumer runs immediately after installing, so a regression in the
      # skill's own tooling fails on its own signal instead of being masked by the
      # aggregate script.
      - name: Install into a scratch skills directory
        run: |
          set -euo pipefail
          SKILLS_DIR="$RUNNER_TEMP/skills" ./install.sh
          test -f "$RUNNER_TEMP/skills/"*/SKILL.md || {
            echo "install.sh produced no SKILL.md"; exit 1; }
          echo "SKILLS_DIR=$RUNNER_TEMP/skills" >> "$GITHUB_ENV"

      - name: Contract check on the installed copy
        run: |
          set -euo pipefail
          SKILL_DIR="$(find "$SKILLS_DIR" -mindepth 1 -maxdepth 1 -type d | head -1)"
          echo "installed: $SKILL_DIR"
          if [ -f "$SKILL_DIR/scripts/check_skill_contract.py" ]; then
            python3 "$SKILL_DIR/scripts/check_skill_contract.py" \
              --skill "$SKILL_DIR" --json contract-report.json
          else
            echo "no contract checker shipped; structure check only"
          fi

      - name: Packaging produces a valid archive
        if: hashFiles('package.sh') != ''
        run: |
          set -euo pipefail
          ./package.sh
          ARCHIVE="$(ls dist/*.zip | head -1)"
          echo "archive: $ARCHIVE"
          # A zip that lost the payload still looks like a successful build.
          unzip -l "$ARCHIVE" | grep -q "SKILL.md" || {
            echo "archive is missing SKILL.md"; exit 1; }

      - name: Upload contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-report
          path: contract-report.json
          if-no-files-found: ignore